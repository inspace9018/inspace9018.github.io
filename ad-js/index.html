<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=300" />
    <meta name="robots" content="noindex" />
    <title>Lookout 광고 (JS 삽입 시험)</title>
    <!-- The 300x250 slot the Lookout dashboard shows on the right (an iframe). RevIQ fills #ad; until it
         does, the house card underneath shows. -->
    <style>
      html,
      body {
        margin: 0;
        width: 300px;
        height: 250px;
        overflow: hidden;
        background: transparent;
        color: #eef1f4;
        font: 12.5px/1.5 'Malgun Gothic', system-ui, sans-serif;
      }
      #slot {
        position: relative;
        width: 300px;
        height: 250px;
      }
      .house {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 10px 12px;
        box-sizing: border-box;
        border: 1px dashed #5b616b;
        border-radius: 6px;
        background: #1a1d22;
      }
      .house small {
        color: #9aa3ad;
        font-size: 10.5px;
      }
      .house p {
        margin: 2px 0;
        color: #cfd5db;
      }
      #ad {
        position: relative;
        z-index: 1;
        width: 300px;
        height: 250px;
      }
    </style>
    <script src="../ad-policy.js"></script>
    <script>
      // RevIQ's other install: the same tag, added by script.
      const s = document.createElement('script');
      s.src = '//js.rev.iq/obeloworks.com';
      s.defer = true;
      document.head.appendChild(s);
    </script>
  </head>
  <body>
    <div id="slot">
      <div class="house">
        <small>광고</small>
        <b>F10으로 오버레이 숨기기</b>
        <p>경기 중 F10을 누르면 오버레이를 숨기고, 다시 누르면 띄웁니다.</p>
      </div>
      <div id="ad" data-ad="right-rail-1" data-ad-size="300x250"></div>
    </div>

    <script>
      // Tells the dashboard the page loaded (offline it keeps its own card instead).
      if (parent !== window) parent.postMessage({ lookoutAd: 'ready' }, '*');
    </script>
  </body>
</html>
