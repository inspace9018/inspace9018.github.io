<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=300" />
    <meta name="robots" content="noindex" />
    <title>Lookout 광고</title>
    <!-- One RevIQ slot the Lookout dashboard shows in a frame. ?slot= picks the unit (default
         right-rail-1, 300x250); the page takes that unit's size. RevIQ fills #ad. No feature-tip
         placeholder is shown while an ad is unavailable. -->
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: transparent;
        color: #eef1f4;
        font: 12.5px/1.5 'Malgun Gothic', system-ui, sans-serif;
      }
      #slot {
        position: relative;
      }
      #ad {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
      }
    </style>
    <script src="../ad-policy.js"></script>
  </head>
  <body>
    <div id="slot">
      <div id="ad"></div>
    </div>
    <script>
      // Runs before the deferred tag, so RevIQ sees the slot it should fill.
      const SIZES = {
          'right-rail-1': '300x250',
          'right-rail-2': '300x600',
          'left-rail-1': '300x250',
          'left-rail-2': '300x600',
          'mobile-unit-1': '300x250'
        },
        asked = new URLSearchParams(location.search).get('slot'),
        // Retired banners stay empty for older clients, without requesting a replacement ad.
        slot = asked === 'leaderboard-1' ? null : SIZES[asked] ? asked : 'right-rail-1',
        [w, h] = (SIZES[slot] || '0x0').split('x');
      const ad = document.getElementById('ad');
      if (slot) ad.dataset.ad = slot;
      if (slot) ad.dataset.adSize = SIZES[slot];
      for (const el of [document.documentElement, document.body, document.getElementById('slot')])
        Object.assign(el.style, { width: w + 'px', height: h + 'px' });
      if (slot) {
        const tag = document.createElement('script');
        tag.src = 'https://js.rev.iq/obeloworks.com';
        tag.defer = true;
        document.head.append(tag);
        if (parent !== window) parent.postMessage({ lookoutAd: 'ready', slot }, '*');
      }
    </script>
  </body>
</html>
