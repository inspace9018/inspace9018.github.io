<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=300" />
    <meta name="robots" content="noindex" />
    <title>Lookout 광고</title>
    <!-- One RevIQ slot the Lookout dashboard shows in a frame. ?slot= picks the unit (default
         right-rail-1, 300x250); the page takes that unit's size. RevIQ fills #ad; until it does, the
         house card underneath shows. -->
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: transparent;
        color: #eef1f4;
        font: 12.5px/1.5 'Malgun Gothic', system-ui, sans-serif;
      }
      #slot {
        position: relative;
      }
      .house {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 10px 12px;
        box-sizing: border-box;
        border: 1px dashed #5b616b;
        border-radius: 6px;
        background: #1a1d22;
      }
      .house small {
        color: #9aa3ad;
        font-size: 10.5px;
      }
      .house p {
        margin: 2px 0;
        color: #cfd5db;
      }
      #ad {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
      }
    </style>
    <script>
      // RevIQ adds its bottom sticky ad (1000x100) to every page. In this frame it would load out of
      // sight, so it goes as soon as it appears, before an ad is asked for.
      new MutationObserver(() => document.querySelectorAll('[data-reviq-sticky-ad]').forEach(e => e.remove())).observe(
        document.documentElement,
        { childList: true, subtree: true }
      );
    </script>
    <script src="https://js.rev.iq/obeloworks.com" defer></script>
  </head>
  <body>
    <div id="slot">
      <div class="house">
        <small>광고</small>
        <b>F10으로 오버레이 숨기기</b>
        <p>경기 중 F10을 누르면 오버레이를 숨기고, 다시 누르면 띄웁니다.</p>
      </div>
      <div id="ad"></div>
    </div>
    <script>
      // Runs before the deferred tag, so RevIQ sees the slot it should fill.
      const SIZES = {
          'right-rail-1': '300x250',
          'right-rail-2': '300x600',
          'left-rail-1': '300x250',
          'left-rail-2': '300x600',
          'leaderboard-1': '728x90',
          'mobile-unit-1': '300x250'
        },
        asked = new URLSearchParams(location.search).get('slot'),
        slot = SIZES[asked] ? asked : 'right-rail-1',
        [w, h] = SIZES[slot].split('x');
      const ad = document.getElementById('ad');
      ad.dataset.ad = slot;
      ad.dataset.adSize = SIZES[slot];
      for (const el of [document.documentElement, document.body, document.getElementById('slot')])
        Object.assign(el.style, { width: w + 'px', height: h + 'px' });
      // Tells the dashboard the page loaded (offline it keeps its own card instead).
      if (parent !== window) parent.postMessage({ lookoutAd: 'ready', slot }, '*');
    </script>
  </body>
</html>
