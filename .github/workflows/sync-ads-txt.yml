# Keeps ads.txt equal to RevIQ's hosted list. GitHub Pages can't redirect /ads.txt, so the file is a
# copy, and RevIQ flags the site as out of sync whenever they add sellers.
name: Sync ads.txt with RevIQ

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-ads-txt
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch RevIQ's list
        run: |
          curl -fsSL --retry 3 --max-time 30 https://rev.iq/inspace9018.github.io/ads.txt -o /tmp/ads.txt
          # Only take a real list: our seller line and owner domain must be in it, and it can't be tiny
          grep -q '^rev\.iq, kKJjA4IXdqzJcaSiGHv2tQzmC3U, DIRECT' /tmp/ads.txt
          grep -q '^ownerdomain=inspace9018\.github\.io' /tmp/ads.txt
          test "$(wc -l < /tmp/ads.txt)" -ge 100
          tr -d '\r' < /tmp/ads.txt > ads.txt

      - name: Commit if it changed
        run: |
          git diff --quiet -- ads.txt && { echo 'ads.txt already matches'; exit 0; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ads.txt
          git commit -m "ads.txt: sync with RevIQ ($(grep -m1 '^# Last Updated:' ads.txt | sed 's/^# Last Updated: //'))"
          git push
